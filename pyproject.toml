[project]
name = "langchain-agent-harness"
version = "0.1.0"
description = "Progetto didattico: anatomia completa di un agent harness con LangChain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "ddgs>=9.0.0",
    "deepagents>=0.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain>=1.2.0",
    "langchain-anthropic>=1.4.0",
    "langchain-mcp-adapters>=0.2.0",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "lxml>=6.0.0",
    "mcp>=1.0.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "lxml-stubs>=0.5.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
harness = "agent_harness.cli:app"
harness-api = "agent_harness.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.handbook]
# `search_roots` è una lista ORDINATA di preferenza: decide quale file vince quando
# un'ancora usa il nome corto (`runner.py`). L'ordine è la ragione per cui questa
# configurazione esiste — non è deducibile dalla struttura del repo.
handbook = "docs/handbook"
lockfile = "docs/handbook/anchors.lock.json"
search_roots = [
    "src/agent_harness",
    "client/src",
    "client/src/components/shared",
    ".",
]
extensions = ["py", "tsx", "ts"]

[tool.handbook.html]
out = "build/handbook/index.html"
context_lines = 3
editor = "vscode"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Gli strumenti del manuale manipolano letteralmente il formato `file · L120–140`:
# l'en dash è parte del dato, non un refuso da normalizzare.
"scripts/handbook_sync.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/handbook_html.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/mdlite.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/handbook_skill.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_handbook_anchors.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_handbook_sync.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_handbook_html.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_mdlite.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_handbook_skill.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_harness"]
